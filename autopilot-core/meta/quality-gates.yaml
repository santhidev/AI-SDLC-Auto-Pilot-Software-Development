# Quality Gates (Core Contract)

requirements:
  - check: traceability
    rule: "Every FR in project/03-requirements/11-SRS.md must map to acceptance criteria and tests in project/meta/traceability.md"

ui:
  - check: ui_visible
    rule: "If UI exists, produce previews/screenshot packs per project/meta/design-profile.yaml"

security:
  - check: scans
    rule: "Security scans must be referenced in project/evidence/security-report.md"

release:
  - check: evidence
    rule: "Evidence index and release approval must exist under project/evidence"
