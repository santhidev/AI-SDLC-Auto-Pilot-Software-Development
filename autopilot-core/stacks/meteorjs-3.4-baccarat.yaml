id: meteorjs-3.4-baccarat
name: "MeteorJS 3.4.0 + React 18 (Baccarat Multiplayer)"
version: "1.0.0"
updated: "2026-04-26"
tags: [meteor, mongodb, realtime, ddp, react, pwa, framer-motion]

profiles:
  project_profile:
    project:
      mode: "no-ask"
      compliance_profile: "enterprise-global"
    platform:
      targets: ["web"]
    stack:
      backend:
        kind: "custom"
        framework: "meteor"
        version: "3.4.0"
        runtime: "node>=20"
        database: "mongodb>=7"
        realtime: "ddp"
        server_logic: "meteor-methods"
        auth: "accounts-anonymous"
        validation: "check+simple-schema"
        rate_limit: "ddp-rate-limiter"
        provably_fair: "crypto-sha256-commit-reveal"
      web:
        frontend: "react"
        react_version: "18+"
        data_layer: "react-meteor-data"
        animation: "framer-motion>=10"
        styling: "css-custom"
        pwa: "service-worker+manifest"
        sound: "web-audio-api"
        build_tool: "vite"
      deployment:
        target: "vps"
        process_manager: "pm2"
        reverse_proxy: "nginx"

  engineering_profile:
    engineering:
      architecture:
        style: "modular-monolith"
      testing:
        approach: "tdd"
        framework: "mocha"
        runner: "meteortesting:mocha"
        scope: [unit, integration]
      quality:
        linting: true
        formatting: true
        static_analysis: true

  design_profile:
    design:
      system:
        base: "custom-minimal"
        tokens:
          approach: "css-variables"
          modes: [dark, light]
      preview:
        web: "screenshots-only"
      visual_regression:
        enabled: true
        baseline_policy: "approve-baseline"

files:
  - to: "project/stack/.meteor-packages.txt"
    content: |
      meteor-base@1.5.1
      mongo@1.16.10
      reactive-var@1.0.12
      tracker@1.3.2
      standard-minifier-css@1.9.2
      standard-minifier-js@2.8.1
      ecmascript@0.16.9
      accounts-base@2.2.8
      brettle:accounts-anonymous@3.0.0
      react-meteor-data@2.5.0
      session@1.2.0
      service-worker@1.0.0
      ddp-rate-limiter@1.1.0
      check@1.3.1
      aldeed:simple-schema@1.13.1
      meteortesting:mocha@2.1.0

constraints:
  requires:
    - "node>=20"
    - "mongodb>=7"
  notes:
    - "If local machine lacks Node, use docker or CI executor."
