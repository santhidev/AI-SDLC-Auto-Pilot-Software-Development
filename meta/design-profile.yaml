design:
  system:
    base: "material"               # material | fluent | custom
    theme_mode: "system"           # light | dark | system
    tokens:
      primary_color: "#2563EB"
      radius: 12
      spacing_scale: 4
      typography: "inter"

  preview:
    web: "storybook"               # storybook | screenshots-only
    mobile: "screenshots-only"     # screenshots-only | widget-catalog
    desktop: "screenshots-only"

  visual_regression:
    enabled: true
    baseline_policy: "approve-baseline"   # approve-baseline | auto-accept

  references:
    require_license_record: true
    allowed_sources:
      - "official design systems"
      - "github repos with explicit permissive license"
