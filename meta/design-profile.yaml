design:
  system:
    base: "material"
    theme_mode: "system"
    tokens:
      primary_color: "#2563EB"
      radius: 12
      spacing_scale: 4
      typography: "inter"

  preview:
    web: "storybook"
    mobile: "screenshots-only"
    desktop: "screenshots-only"

  visual_regression:
    enabled: true
    baseline_policy: "approve-baseline"

  references:
    require_license_record: true
