project:
  name: "<auto-from-requirement>"
  mode: "no-ask"                 # no-ask | wizard
  compliance_profile: "enterprise-global"  # max
  privacy_regime: "pdpa"          # default

platform:
  targets: ["web", "mobile", "desktop"]

stack:
  backend:
    preset: "ts"
    framework: "nestjs"
    database: "postgres"
    cache: "redis"
    messaging: "rabbitmq"

  web:
    framework: "nextjs"
    ui_library: "mui"

  mobile:
    framework: "flutter"
    variant: "<none>"

  desktop:
    framework: "tauri"

deployment:
  hosting: "vps"
  container: true
  orchestration: "docker-compose"
  environments: [dev, staging, prod]

ci:
  provider: "github-actions"
