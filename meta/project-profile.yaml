project:
  name: "<auto-from-requirement>"
  mode: "no-ask"                 # no-ask | wizard
  compliance_profile: "enterprise-global"
  privacy_regime: "pdpa"          # default; can extend to gdpr

platform:
  targets: ["web", "mobile", "desktop"]

stack:
  backend:
    kind: "saas-or-custom"         # saas-or-custom
    custom:
      framework: "nestjs"
      language: "typescript"
    database: "postgres"
    cache: "redis"
    queue: "rabbitmq"

  web:
    framework: "nextjs"
    ui_library: "mui"

  mobile:
    framework: "flutter"

  desktop:
    framework: "tauri"

deployment:
  hosting: "vps"
  container: true
  orchestration: "docker-compose"
  environments: [dev, staging, prod]

ci:
  provider: "github-actions"
