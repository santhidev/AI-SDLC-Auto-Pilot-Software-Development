engineering:
  architecture:
    style: "clean"
    module_boundary: "feature"

  testing:
    approach: "tdd"
    pyramid:
      unit: "high"
      integration: "medium"
      e2e: "critical-only"

  ui_build:
    strategy: "component-first"

  quality:
    dependency_scan: true
    secret_scan: true
    sast: true
    sbom: true
