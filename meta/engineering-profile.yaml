engineering:
  architecture:
    style: "clean"
    module_boundary: "feature"
    dependency_rule: "inward"

  testing:
    approach: "tdd"
    pyramid:
      unit: "high"
      integration: "medium"
      e2e: "critical-only"
    gates:
      e2e_must_pass_runs: 3
      flaky_retries: 2

  quality:
    linting: true
    formatting: true
    static_analysis: true
    dependency_scan: true
    secret_scan: true
    sast: true
    sbom: true

  observability:
    structured_logs: true
    metrics: true
    tracing: true
