# Quality Gates — Ultimate

requirements:
  - check: traceability
    rule: "Every FR must map to at least one acceptance criteria and at least one test"

ui:
  - check: ui_visible
    rule: "Web must produce Storybook; Mobile/Desktop must produce screenshot packs"

security:
  - check: scans
    rule: "Dependency scan + secret scan + SAST + SBOM referenced in evidence/security-report.md"

release:
  - check: evidence
    rule: "evidence index + release approval must exist"
